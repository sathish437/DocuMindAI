worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # High performance gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Accurately preserve client protocol behind Cloudflare/Render edge proxies
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        # Dynamically replaced by entrypoint.sh with $PORT (Render default: 10000)
        listen __PORT__;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Support document uploads up to 30MB
        client_max_body_size 30M;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Static assets caching (1 year for immutable hashed Vite chunks)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint for Render / load balancers: reflects actual Spring Boot readiness
        location /healthz {
            access_log off;
            proxy_pass http://127.0.0.1:8080/actuator/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        # Reverse proxy all /api requests directly to Spring Boot backend on 127.0.0.1:8080
        location /api {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            # Extended timeouts for LLM streaming and embedding generation
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Return proper JSON error if backend is unavailable instead of a misleading 404
            error_page 502 503 504 = @backend_down;
        }

        # Reverse proxy Actuator endpoints (optional health/metrics)
        location /actuator/ {
            proxy_pass http://127.0.0.1:8080/actuator/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Single Page Application (SPA) routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # JSON error handler when Spring Boot is temporarily unavailable
        location @backend_down {
            default_type application/json;
            return 503 '{"status":503,"error":"Service Unavailable","message":"Backend service is temporarily unavailable. Please retry in a few moments."}';
        }
    }
}
