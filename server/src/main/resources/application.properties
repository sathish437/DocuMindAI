spring.application.name=DocuMindAI
    
# Multipart file upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# Document Upload and Validation Limits
app.upload.max-file-size=20MB
app.upload.max-files-per-request=10

# Neon PostgreSQL Datasource Configuration
# Credentials are kept outside source code via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
# 'update' is safe for development: it adds columns/tables without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring AI configuration fallback for local development and testing
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}

# Google GenAI Embedding Configuration
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.options.dimensions=768

# pgvector VectorStore Configuration
spring.ai.vectorstore.type=pgvector
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=document_vector_store
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=false

# Spring Boot Actuator Observability & Metrics Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.metrics.enabled=true
management.observations.key-values.application=DocuMindAI

# Enable standard forward header processing behind reverse proxies (Nginx, Render, Cloudflare)
server.forward-headers-strategy=framework

# CORS Configuration (defaults to * for full compatibility across local and production origins)
app.cors.allowed-origins=*
